[project]
name = "strata-bench"
version = "0.2.0"
description = "Strata benchmarks for constraint and logic programming: frozen instance splits, reference encodings, correctness instruments, and the scorer that judges an encoding on them."
requires-python = ">=3.11"
dependencies = ["clingo==5.8.0"]

[project.scripts]
strata = "strata_bench.cli:main"
strata-calibrate = "strata_bench.calibrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strata_bench"]
